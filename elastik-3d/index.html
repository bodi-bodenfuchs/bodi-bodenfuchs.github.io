<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elastische Bodenbeläge – 3D-Baukasten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1ec; --panel:#fffdf9; --ink:#2b2620; --muted:#6f665b; --line:#e3ddd3;
    --accent:#b5652b; --accent-soft:#f6e7da; --ok:#2f7d4f; --ok-soft:#e1f1e6; --err:#b83a2e; --err-soft:#f8e1de;
    --blue:#2d5d8f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:16px}
  body{display:flex;flex-direction:column}
  header{padding:12px 20px 6px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
  header h1{font-size:1.35rem;margin:0;font-weight:700;letter-spacing:-.01em}
  header p{margin:0;color:var(--muted);font-size:.95rem}
  .products{display:flex;flex-direction:column;gap:4px;padding:2px 20px 10px}
  .prow{display:flex;gap:8px;overflow-x:auto;align-items:center}
  .products .grp{flex:0 0 140px;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;line-height:1.2}
  .products button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 9px;border-radius:9px;font:inherit;font-size:.86rem;cursor:pointer;display:flex;gap:8px;align-items:center}
  .products button .nr{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.78rem}
  .products button.g-forbo .nr{background:#e3ecf5;color:#2d5d8f}
  .products button.g-inku .nr{background:#e5ecdf;color:#4f6b3a}
  .products button.g-skript .nr{background:#f3e3f0;color:#8a3d7a}
  .products button.g-verlegung .nr{background:#efe9d6;color:#7a5d12}
  .products button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .products button.active .nr{background:#fff;color:var(--ink)}
  main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:14px;padding:0 20px 20px}
  #stage{position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(#ebe6de,#d7cfc2);border:1px solid var(--line);min-height:420px}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none}
  #stage.dragover{outline:3px dashed var(--accent);outline-offset:-6px}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;transform:translate(0,-50%);display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:.85rem;font-weight:600}
  .lbl .dot{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--ink);color:#fff;font-size:.8rem;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .lbl .txt{background:rgba(255,253,249,.92);padding:2px 8px;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .lbl.q .dot{background:var(--accent);animation:pulse 1s infinite}
  .lbl.zone{transform:translate(-50%,-50%);font-size:.8rem;color:var(--muted);font-weight:600;background:rgba(255,253,249,.7);padding:2px 8px;border-radius:6px}
  @keyframes pulse{50%{transform:scale(1.15)}}
  #tooltip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;padding:4px 9px;border-radius:6px;font-size:.85rem;display:none;white-space:nowrap;z-index:3}
  #stageHint{position:absolute;left:12px;bottom:10px;font-size:.8rem;color:var(--muted);background:rgba(255,253,249,.85);padding:3px 8px;border-radius:6px}
  #views{position:absolute;right:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
  #views button{border:1px solid var(--line);background:rgba(255,253,249,.92);border-radius:8px;padding:5px 9px;font:inherit;font-size:.82rem;cursor:pointer;color:var(--ink)}
  #views button:hover{border-color:var(--ink)}
  #views button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  #banner{position:absolute;left:50%;top:52px;transform:translateX(-50%);max-width:88%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;box-shadow:0 6px 20px rgba(0,0,0,.12);font-size:.95rem;display:none;text-align:center;z-index:2}
  #banner.ok{border-color:#9fd0b0;background:var(--ok-soft)}
  #banner.err{border-color:#e6aaa3;background:var(--err-soft)}
  aside{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;min-height:0}
  .modes{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
  .modes button{border:0;background:none;padding:11px 4px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
  .modes button.active{color:var(--ink);border-bottom-color:var(--accent)}
  .modes button small{display:block;font-weight:400;font-size:.72rem;white-space:nowrap}
  .pane{padding:14px 16px;overflow-y:auto;flex:1}
  .pane h2{font-size:1.1rem;margin:0 0 4px}
  .pane h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px}
  .maker{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:#4f6b3a;font-weight:700}
  .muted{color:var(--muted)}
  .levels{display:flex;align-items:center;gap:6px;margin:10px 0 4px;font-size:.9rem}
  .levels .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .levels .seg button{border:0;background:#fff;padding:6px 11px;font:inherit;font-size:.88rem;cursor:pointer;color:var(--ink)}
  .levels .seg button+button{border-left:1px solid var(--line)}
  .levels .seg button.on{background:var(--accent);color:#fff}
  .lvlinfo{font-size:.82rem;color:var(--muted);margin:2px 0 6px}
  .task{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.95rem;margin:8px 0 4px}
  .cards{display:flex;flex-direction:column;gap:7px}
  .card{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font:inherit;font-size:.95rem;cursor:pointer;color:var(--ink)}
  .card[draggable=true]{cursor:grab}
  .card:hover{border-color:var(--accent)}
  .card .sw{flex:0 0 auto;width:30px;height:18px;border-radius:4px;border:1px solid rgba(0,0,0,.15);background-size:cover}
  .card.done{background:var(--ok-soft);border-color:#b9dcc5;cursor:default}
  .card.wrong{animation:shake .35s;border-color:var(--err);background:var(--err-soft)}
  .card.sel{border-color:var(--blue);box-shadow:0 0 0 2px rgba(45,93,143,.2)}
  .card .n{flex:0 0 auto;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:.8rem;font-weight:700}
  .card .tag{margin-left:auto;font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .stack{display:flex;flex-direction:column-reverse;gap:4px}
  .slot{border:1px dashed #cfc6b8;border-radius:8px;padding:6px 10px;font-size:.88rem;color:var(--muted);min-height:32px;display:flex;align-items:center;gap:8px}
  .slot .sw{width:26px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.15);background-size:cover;flex:0 0 auto}
  .slot.filled{border-style:solid;border-color:#b9dcc5;background:var(--ok-soft);color:var(--ink)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;font:inherit;font-size:.92rem;cursor:pointer;color:var(--ink)}
  .btn:hover{border-color:var(--ink)}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .stats{display:flex;gap:14px;font-size:.9rem;margin-top:6px;flex-wrap:wrap}
  .stats b{font-size:1.05rem;font-variant-numeric:tabular-nums}
  .info{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;margin-top:12px}
  .info h4{margin:0 0 6px;font-size:1.05rem;display:flex;gap:8px;align-items:center}
  .info p{margin:6px 0;font-size:.95rem;line-height:1.4}
  .info .lab{font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);display:block;margin-top:8px}
  .info .badge{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:.85rem;flex:0 0 auto}
  label.ctl{display:flex;align-items:center;gap:10px;font-size:.92rem;margin:8px 0}
  input[type=range]{flex:1;accent-color:var(--accent)}
  .facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem;margin:8px 0}
  .facts dt{color:var(--muted)}
  .facts dd{margin:0}
  details{border-top:1px solid var(--line);padding:10px 16px;max-height:45%;overflow-y:auto}
  details summary{cursor:pointer;font-weight:600}
  details p{font-size:.93rem;line-height:1.45;margin:8px 0}
  details a{color:var(--blue)}
  .merke{border-left:4px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.93rem;margin:10px 0}
  .credit{font-size:.78rem;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips .card{width:auto;padding:6px 9px;font-size:.86rem;gap:6px}
  .chips .card .sw{width:14px;height:14px;border-radius:50%}
  .answers{display:grid;grid-template-columns:1fr;gap:7px}
  .done-box{background:var(--ok-soft);border:1px solid #b9dcc5;border-radius:12px;padding:12px 14px;margin-top:12px}
  .stars{font-size:1.4rem;letter-spacing:2px;color:#d79a1e}
  .stars .off{color:#d9d2c6}
  .guide{position:fixed;inset:0;background:rgba(30,26,20,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 12px}
  .guide[hidden]{display:none}
  .guide-box{background:var(--panel);border-radius:16px;max-width:880px;width:100%;padding:22px 26px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .guide-box h2{margin:0 0 4px;font-size:1.4rem}
  .guide-box h3{margin:20px 0 8px;font-size:1rem;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
  .guide-box p,.guide-box li{line-height:1.45}
  .guide-box table{width:100%;border-collapse:collapse;font-size:.93rem}
  .guide-box td,.guide-box th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
  .guide-box th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .guide-box .kap{white-space:nowrap;color:var(--muted);font-size:.85rem}
  .guide-box .go{display:inline-block;margin:2px 4px 2px 0;padding:3px 9px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font:inherit;font-size:.85rem}
  .guide-box .go:hover{border-color:var(--ink)}
  .guide-box tr.done td{background:var(--ok-soft)}
  @media (max-width:900px){
    body{display:block}
    main{grid-template-columns:1fr}
    #stage{height:58vh;min-height:340px}
    details{max-height:none}
  }
</style>
</head>
<body>
<header>
  <h1>Elastische Bodenbeläge</h1>
  <p>3D-Baukasten zum Skriptum: Schichtaufbau, Herstellung und Verlegung</p>
  <button class="btn" id="guideBtn" style="margin-left:auto">📘 Anleitung &amp; Aufträge</button>
</header>
<div id="guide" class="guide" hidden><div class="guide-box" role="dialog" aria-label="Anleitung"><button class="btn" id="guideClose" style="float:right">✕ Schließen</button><div id="guideBody"></div></div></div>
<nav class="products" id="products"></nav>
<main>
  <div id="stage">
    <div id="labels"></div>
    <div id="tooltip"></div>
    <div id="views"></div>
    <div id="banner"></div>
    <div id="stageHint"></div>
  </div>
  <aside>
    <div class="modes" id="modes">
      <button data-mode="build">Bauen<small>stapeln</small></button>
      <button data-mode="explore">Erkunden<small>ansehen</small></button>
      <button data-mode="name">Benennen<small>prüfen</small></button>
      <button data-mode="prod">Herstellung<small>Produktion</small></button>
      <button data-mode="tiles">Fliesen<small>aufteilen</small></button>
    </div>
    <div class="pane" id="pane"></div>
    <details id="about">
      <summary>Über diesen Belag</summary>
      <div id="aboutBody"></div>
    </details>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
if(!window.THREE||!THREE.OrbitControls){document.getElementById('stage').innerHTML='<p style="padding:20px">Die 3D-Bibliothek konnte nicht geladen werden. Bitte Seite neu laden oder Internetverbindung prüfen.</p>';throw new Error('three.js fehlt')}

/* =========================================================
   TEXTUREN (prozedural, auf Canvas gezeichnet)
   ========================================================= */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const texCache={}, swatchCache={};
function hashStr(s){let h=7;for(const c of s)h=h*31+c.charCodeAt(0)|0;return h}
function canvasTex(key,w,h,draw){
  if(texCache[key]) return texCache[key];
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');draw(g,w,h,rng(hashStr(key)));
  swatchCache[key]=c.toDataURL();
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;texCache[key]=t;return t;
}
function noise(g,w,h,r,amt){const d=g.getImageData(0,0,w,h);for(let i=0;i<d.data.length;i+=4){const n=(r()-.5)*amt;d.data[i]+=n;d.data[i+1]+=n;d.data[i+2]+=n}g.putImageData(d,0,0)}
function grainLines(g,w,h,r,n,cols,ampMax){
  for(let i=0;i<n;i++){
    const y0=r()*h, amp=1+r()*ampMax, f=.002+r()*.01, ph=r()*6;
    g.strokeStyle=cols[(r()*cols.length)|0];g.globalAlpha=.08+r()*.3;g.lineWidth=.5+r()*2;
    g.beginPath();for(let x=0;x<=w;x+=8){const y=y0+Math.sin(x*f+ph)*amp+Math.sin(x*f*3.1)*amp*.3;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();
  }
  g.globalAlpha=1;
}
function wood(base,dark,light,opts={}){return (g,w,h,r)=>{
  g.fillStyle=base;g.fillRect(0,0,w,h);
  for(let i=0;i<10;i++){g.fillStyle=(r()<.5?dark:light);g.globalAlpha=.08+r()*.1;const y=r()*h;g.fillRect(0,y,w,8+r()*30)}
  g.globalAlpha=1;
  grainLines(g,w,h,r,170,[dark,dark,light],5);
  if(opts.pores){for(let i=0;i<900;i++){g.fillStyle=dark;g.globalAlpha=.25+r()*.3;g.fillRect(r()*w,r()*h,3+r()*9,1)}g.globalAlpha=1}
  if(opts.rays){for(let i=0;i<60;i++){g.fillStyle=light;g.globalAlpha=.25;g.beginPath();g.ellipse(r()*w,r()*h,6+r()*14,1.5,0,0,7);g.fill()}g.globalAlpha=1}
  const knots=opts.knots??2;
  for(let k=0;k<knots;k++){const cx=r()*w,cy=r()*h;g.globalAlpha=.35;g.strokeStyle=dark;for(let j=1;j<6;j++){g.lineWidth=1;g.beginPath();g.ellipse(cx,cy,j*6,j*2.2,0,0,7);g.stroke()}}
  g.globalAlpha=1;noise(g,w,h,r,14);
}}
function lamellae(base,dark,stripW,vertRings){return (g,w,h,r)=>{
  // quer liegende Lamellen: Streifen entlang der Länge (u)
  let x=0;
  while(x<w){const sw=stripW*(.7+r()*.6);const l=(r()-.5)*22;
    g.fillStyle=base;g.fillRect(x,0,sw,h);
    g.fillStyle=l>0?'rgba(255,255,255,'+(l/80)+')':'rgba(0,0,0,'+(-l/80)+')';g.fillRect(x,0,sw,h);
    g.strokeStyle=dark;g.lineWidth=1;
    const lines=vertRings?10:4;
    for(let i=0;i<lines;i++){g.globalAlpha=.15+r()*.25;const xx=x+r()*sw;g.beginPath();g.moveTo(xx,0);
      for(let y=0;y<=h;y+=16)g.lineTo(xx+Math.sin(y*.02+i)*(vertRings?1:4),y);g.stroke()}
    g.globalAlpha=.6;g.fillStyle=dark;g.fillRect(x+sw-1.5,0,1.5,h);g.globalAlpha=1;
    x+=sw;}
  noise(g,w,h,r,12);
}}
function solid(col,amt=10){return (g,w,h,r)=>{g.fillStyle=col;g.fillRect(0,0,w,h);noise(g,w,h,r,amt)}}
function clearTex(fill,lineCol,mode){return (g,w,h,r)=>{
  g.fillStyle=fill;g.fillRect(0,0,w,h);
  if(mode==='grain'){for(let i=0;i<140;i++){const y0=r()*h,a=1+r()*4,f=.003+r()*.008;g.strokeStyle=lineCol.replace('A',(.15+r()*.35).toFixed(2));g.lineWidth=.6+r()*1.4;g.beginPath();for(let x=0;x<=w;x+=10){const y=y0+Math.sin(x*f)*a;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}}
  else if(mode==='streak'){for(let i=0;i<20;i++){g.fillStyle=lineCol.replace('A',(.15+r()*.2).toFixed(2));g.fillRect(r()*w,0,2+r()*40,h)}}
  else{for(let i=0;i<60;i++){g.strokeStyle=lineCol.replace('A',(.2+r()*.4).toFixed(2));g.lineWidth=1;g.beginPath();const y=r()*h;g.moveTo(0,y);g.lineTo(w,y+(r()-.5)*20);g.stroke()}}
}}

/* Profilgeometrie: Querschnitt (Breite u, Höhe v) wird entlang der Länge extrudiert.
   'nf'    = Nut und Feder / Nut und Kamm
   'click' = Klickprofil mit Rastnase (Feder mit Haken, Nut mit verlängerter Unterlippe) */
function profileGeometry(len,wid,t,type){
  const tg=Math.min(.17,wid*.11), hw=wid/2;
  const s=new THREE.Shape();
  if(type==='click'){
    s.moveTo(-hw-tg*.55,0);
    s.lineTo(hw-tg*.55,0);              // Aussparung für die Unterlippe der Nachbardiele
    s.lineTo(hw-tg*.55,t*.36);
    s.lineTo(hw+tg*.95,t*.36);
    s.lineTo(hw+tg*.95,t*.22);          // Rastnase nach unten
    s.lineTo(hw+tg*1.35,t*.22);
    s.lineTo(hw+tg*1.35,t*.56);
    s.lineTo(hw+tg*.35,t*.64);
    s.lineTo(hw,t*.64);
    s.lineTo(hw,t);
    s.lineTo(-hw,t);
    s.lineTo(-hw,t*.68);
    s.lineTo(-hw+tg*1.4,t*.68);         // Nut
    s.lineTo(-hw+tg*1.4,t*.18);
    s.lineTo(-hw+tg*.95,t*.18);
    s.lineTo(-hw+tg*.95,t*.34);         // Rastkante
    s.lineTo(-hw-tg*.55,t*.34);         // verlängerte Unterlippe
    s.lineTo(-hw-tg*.55,0);
  }else{
    s.moveTo(-hw,0);s.lineTo(hw,0);s.lineTo(hw,t*.35);s.lineTo(hw+tg,t*.38);s.lineTo(hw+tg,t*.62);s.lineTo(hw,t*.65);s.lineTo(hw,t);
    s.lineTo(-hw,t);s.lineTo(-hw,t*.7);s.lineTo(-hw+tg,t*.66);s.lineTo(-hw+tg,t*.34);s.lineTo(-hw,t*.3);s.lineTo(-hw,0);
  }
  const geo=new THREE.ExtrudeGeometry(s,{depth:len,bevelEnabled:false});
  geo.rotateY(-Math.PI/2);geo.translate(len/2,-t/2,0);
  const uv=geo.attributes.uv;for(let i=0;i<uv.count;i++){uv.setXY(i,uv.getX(i)/4,uv.getY(i)/1.4)}
  return geo;
}

let P=0, mode='build', level='mittel', meshes=[], placed=0, errors=0, tips=0, explode=.8, showLabels=true, trueScale=false;

function bottomUp(){return PRODUCTS[P].layers.slice().reverse()}
function shuffle(a,seed){const r=rng(seed||(Date.now()&0xffffff));for(let i=a.length-1;i>0;i--){const j=(r()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function fmtMM(v){return v<1?String(v).replace('.',','):v.toLocaleString('de-DE',{maximumFractionDigits:1})}

function clearRoot(){meshes.forEach(m=>{m.geometry.dispose();m.material.dispose();root.remove(m)});meshes=[];removeNeighbor()}
function layerT(ly){return (trueScale&&ly.mm!=null)?Math.max(ly.mm*.05,.006):ly.t}

function buildProduct(){
  clearRoot();
  let y=0;
  bottomUp().forEach((ly,b)=>{
    const t=layerT(ly);
    const len=ly.separate?LM:L, wid=ly.separate?WM:W;
    const geo=ly.profile?profileGeometry(len,wid,t,ly.profile):new THREE.BoxGeometry(len,t,wid);
    const mat=new THREE.MeshStandardMaterial({map:getTex(ly.tex),roughness:ly.clear?.15:.72,metalness:0,
      transparent:!!ly.clear,opacity:ly.clear?.85:1,depthWrite:!ly.clear,side:ly.clear?THREE.DoubleSide:THREE.FrontSide});
    let m;
    if(ly.strips){m=new THREE.Mesh(new THREE.BoxGeometry(.3,t,wid),mat);[-1.6,1.6].forEach(x=>{const c=new THREE.Mesh(new THREE.BoxGeometry(.3,t,wid),mat);c.position.x=x;c.castShadow=true;m.add(c)});geo.dispose()}
    else m=new THREE.Mesh(geo,mat);
    if(ly.noppen){const ng=new THREE.CylinderGeometry(.09,.09,.08,20);for(let ix=0;ix<14;ix++)for(let iz=0;iz<5;iz++){const c=new THREE.Mesh(ng,mat);c.position.set(-len/2+.15+ix*(len-.3)/13,t/2+.04,-wid/2+.15+iz*(wid-.3)/4);c.castShadow=true;m.add(c)}}
    m.castShadow=!ly.clear;m.receiveShadow=true;
    m.userData={b,ly,t,baseY:y+t/2,cur:new THREE.Vector3(),target:new THREE.Vector3(),rot:0,targetRot:0,shake:0,flash:null};
    y+=t;root.add(m);meshes.push(m);
  });
}
function stackPos(m,ex){const b=m.userData.b,n=meshes.length;return new THREE.Vector3((b-(n-1)/2)*ex*.34,m.userData.baseY+b*ex*.42,0)}
function scatterPos(k,n){const side=k%2===0?-1:1,row=Math.floor(k/2),rows=Math.ceil(n/2);return new THREE.Vector3(side*5.9,0,(row-(rows-1)/2)*2.15)}
function setTargets(){
  meshes.forEach(m=>{
    const u=m.userData;if(u.dragging)return;
    if(mode==='build'){
      if(u.placed){u.target.copy(stackPos(m,0));u.targetRot=0}
      else{const p=scatterPos(buildOrder.indexOf(u.b),meshes.length);p.y=u.t/2;u.target.copy(p);u.targetRot=u.scRot}
    }else{u.target.copy(stackPos(m,mode==='name'?Math.max(explode,.8):explode));u.targetRot=0}
  });
}
function snap(){meshes.forEach(m=>{m.userData.cur.copy(m.userData.target);m.userData.rot=m.userData.targetRot})}

function modelBox(){const b=new THREE.Box3();meshes.forEach(m=>{const u=m.userData;const len=u.ly.separate?LM:L,wid=u.ly.separate?WM:W;
  b.expandByPoint(new THREE.Vector3(u.target.x-len/2,u.target.y-u.t/2,-wid/2));b.expandByPoint(new THREE.Vector3(u.target.x+len/2,u.target.y+u.t/2,wid/2))});
  if(neighbor)b.expandByPoint(new THREE.Vector3(0,0,W*1.5));return b}
function aimCamera(v){
  if(mode==='prod'){overview();renderViews();return}
  if(mode==='tiles'){tilesCam();renderViews();return}
  if(v)view=v;
  const aspect=stage.clientWidth/Math.max(stage.clientHeight,1),k=Math.max(1,1.55/aspect);
  if(mode==='build'){view='schraeg';const d=Math.max(14,9.4/(Math.tan(19*Math.PI/180)*aspect));
    camGoal={pos:new THREE.Vector3(0,.69*d,.72*d),tgt:new THREE.Vector3(0,0,.3)};renderViews();return}
  const box=modelBox(),c=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
  if(view==='stirn'){const tgt=new THREE.Vector3(box.max.x,c.y,c.z);camGoal={pos:tgt.clone().add(new THREE.Vector3(2.6+size.y*1.5,.5+size.y*.4,.9).multiplyScalar(k)),tgt}}
  else if(view==='oben'){camGoal={pos:new THREE.Vector3(c.x+.01,c.y+9*k,c.z+.4),tgt:c.clone()}}
  else{camGoal={pos:new THREE.Vector3(c.x+5.2*k,c.y+3.4+size.y*.4,c.z+7.2*k),tgt:new THREE.Vector3(c.x*.5,c.y,c.z)}}
  renderViews();
}

function removeNeighbor(){if(!neighbor)return;neighbor.traverse(o=>{if(o.isMesh)o.material.dispose()});scene.remove(neighbor);neighbor=null}
function showNeighbor(){
  removeNeighbor();
  explode=0;setTargets();const ex=$('#ex');if(ex)ex.value=0;
  neighbor=new THREE.Group();
  meshes.forEach(m=>{if(m.userData.ly.separate)return;const c=new THREE.Mesh(m.geometry,m.material.clone());c.material.emissive.setRGB(0,0,0);
    c.position.copy(stackPos(m,0));c.castShadow=m.castShadow;c.receiveShadow=true;neighbor.add(c)});
  neighbor.userData={from:W+1.6,to:W,t:0};neighbor.position.z=W+1.6;scene.add(neighbor);
  aimCamera('stirn');
  showBanner(`So greifen die Profile ineinander: ${PRODUCTS[P].layers.find(l=>l.profile).profile==='click'?'<b>Klickverbindung</b> – die Rastnase hakt hinter die Kante der Unterlippe.':'<b>Nut und Feder</b> – die Feder schiebt sich passgenau in die Nut.'}`);
}

function setMode(m){
  mode=m;selected=null;hideBanner();removeNeighbor();tStart=null;tEnd=null;playing=false;
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  const n=meshes.length;
  if(m==='build'){
    placed=0;errors=0;tips=0;
    buildOrder=shuffle([...Array(n).keys()]);
    const r=rng(n*13+P+1);
    meshes.forEach(x=>{x.userData.placed=false;x.userData.scRot=(r()-.5)*.35});
    renderBuild();
  }else if(m==='explore'){renderExplore()}
  else if(m==='tiles'){
    document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
    resetTiles();renderViews();
    $('#stageHint').textContent='Ziehen = drehen · Mausrad/2 Finger = zoomen · orange = Randfliesen (geschnitten)';
    return;
  }
  else if(m==='prod'){
    document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
    if(PRODUCTS[P].proc)curProc=PRODUCTS[P].proc;
    stepIdx=0;orderState=null;buildProd();overview();renderProd();renderViews();
    $('#stageHint').textContent='Ziehen = drehen · Mausrad/2 Finger = zoomen · Rechtsklick = verschieben';
    return;
  }
  else{
    nameQueue=shuffle([...Array(n).keys()]);nameIdx=0;nameErrors=0;nameSolved=new Set();
    const layers=bottomUp();
    answers=layers.map((ly,b)=>({b,name:ly.name}));
    if(level==='schwer'){
      const own=new Set(layers.map(l=>l.name));
      const pool=[...new Set(PRODUCTS.filter((p,i)=>i!==P&&p.group===PRODUCTS[P].group).flatMap(p=>p.layers.map(l=>l.name)))].filter(x=>!own.has(x));
      shuffle(pool).slice(0,3).forEach(name=>answers.push({b:-1,name}));
    }
    shuffle(answers);
    renderName();
  }
  setTargets();aimCamera(m==='build'?'schraeg':'schraeg');
  $('#stageHint').textContent=m==='build'?'Teile ziehen und auf der hellen Fläche ablegen – oder antippen · Ziehen auf leerer Fläche = drehen':'Ziehen = drehen · Mausrad/2 Finger = zoomen · Rechtsklick/3 Finger = verschieben';
}

function renderBuild(){

      ${res.better&&res.prev?' <b>Neue Bestleistung!</b>':''}${!res.better&&res.prev?` <span class="muted">Bestleistung: ${res.prev.e} Fehler, ${fmtTime(res.prev.s)}</span>`:''}

  pane.innerHTML=`${headHTML()}${levelHTML()}
    <div class="task">Baue den Belag <b>von unten nach oben</b> auf. Ziehe die Teile im 3D-Modell auf die helle Fläche${level==='schwer'?'':' oder klicke sie in der Liste an'}.</div>
    <div class="stats"><span>Eingebaut: <b>${placed}/${n}</b></span><span>Fehler: <b>${errors}</b></span>${level!=='schwer'?`<span>Tipps: <b>${tips}</b></span>`:''}<span>Zeit: <b id="timer">${fmtTime(elapsed())}</b></span></div>

    <h3>Dein Aufbau (unten → oben)</h3>
    <div class="stack">${layers.map((ly,b)=>`<div class="slot ${b<placed?'filled':''}">${b<placed?swatch(ly)+ly.name:(b===placed?'⬚ nächste Schicht …':'')}</div>`).join('')}</div>
    ${doneBox}
    <div class="row">${!done&&level!=='schwer'?'<button class="btn" id="tipBtn">💡 Tipp</button>':''}<button class="btn" id="resetBtn">↺ Neu starten</button></div>`;
  bindLevels();
  pane.querySelectorAll('#buildCards .card:not(.done)').forEach(c=>{
    const b=+c.dataset.b;
    c.onclick=()=>{startTimer();tryPlace(b)};
    c.onmouseenter=()=>{hover=meshes[b]};c.onmouseleave=()=>{hover=null};
    c.ondragstart=e=>{e.dataTransfer.setData('text/plain',String(b));e.dataTransfer.effectAllowed='move';hover=meshes[b]};
    c.ondragend=()=>{hover=null;stage.classList.remove('dragover')};
  });
  const tb=$('#tipBtn');if(tb)tb.onclick=()=>{startTimer();tips++;const m=meshes[placed];m.userData.flash={col:[.9,.7,.1],t:1.8};
    showBanner(`Tipp: Gesucht ist die Schicht, die <b>${placed===0?'ganz unten':'direkt auf „'+layers[placed-1].name+'“'}</b> liegt. Sie blinkt gelb.`);renderBuild()};
  $('#resetBtn').onclick=()=>setMode('build');
  const ge=$('#goExplore');if(ge)ge.onclick=()=>setMode('explore');
  const gn=$('#goName');if(gn)gn.onclick=()=>setMode('name');
}
function tryPlace(b){
  const m=meshes[b],layers=bottomUp();
  if(m.userData.placed||mode!=='build')return;
  startTimer();
  if(b===placed){
    m.userData.placed=true;placed++;m.userData.flash={col:[.1,.6,.25],t:.8};
    if(placed===layers.length){stopTimer();showBanner(`<b>Richtig – fertig!</b> Alle ${layers.length} Schichten sitzen.`,'ok')}
    else showBanner(`<b>Richtig:</b> ${m.userData.ly.name}. <span class="muted">${level==='schwer'?'':m.userData.ly.func}</span>`,'ok');
  }else{
    errors++;m.userData.shake=.5;m.userData.flash={col:[.8,.1,.05],t:.7};
    const diff=b-placed;
    let msg;
    if(level==='schwer')msg='<b>Falsch.</b> Diese Schicht kommt noch nicht dran.';
    else if(level==='leicht')msg=`<b>Noch nicht.</b> „${m.userData.ly.name}“ liegt <b>${diff===1?'eine Schicht':diff+' Schichten'}</b> weiter oben. ${placed===0?'Welche Schicht liegt ganz unten?':`Was liegt direkt auf „${layers[placed-1].name}“?`}`;
    else msg=`<b>Noch nicht.</b> „${m.userData.ly.name}“ liegt weiter oben. ${placed===0?'Welche Schicht liegt ganz unten?':`Was liegt direkt auf „${layers[placed-1].name}“?`}`;
    showBanner(msg,'err');
  }
  setTargets();renderBuild();
  if(!m.userData.placed){const c=pane.querySelector(`.card[data-b="${b}"]`);if(c)c.classList.add('wrong')}
}

/* =========================================================
   INTERAKTION IM 3D: Klicken, Ziehen & Ablegen
   ========================================================= */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
const dragPlane=new THREE.Plane(new THREE.Vector3(0,1,0),-.9), hitPt=new THREE.Vector3();
function setRay(ev){const r=renderer.domElement.getBoundingClientRect();mouse.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);ray.setFromCamera(mouse,camera)}
function pick(ev){if(mode==='prod'||mode==='tiles')return null;setRay(ev);const c=mode==='build'?meshes.filter(m=>!m.userData.placed):meshes;const h=ray.intersectObjects(c,false)[0];return h?h.object:null}
const inZone=p=>Math.abs(p.x)<3.1&&Math.abs(p.z)<1.7;

// Capture-Phase: läuft vor OrbitControls, damit ein gegriffenes Teil die Kamera nicht dreht
stage.addEventListener('pointerdown',e=>{
  if(e.target!==renderer.domElement||mode!=='build'||e.button>0)return;
  const m=pick(e);if(!m)return;
  controls.enabled=false;
  drag={m,x:e.clientX,y:e.clientY,moved:false};m.userData.dragging=true;startTimer();
},true);
window.addEventListener('pointermove',e=>{
  if(drag){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>5)drag.moved=true;
    if(drag.moved){setRay(e);if(ray.ray.intersectPlane(dragPlane,hitPt)){const u=drag.m.userData;u.target.set(hitPt.x,.9,hitPt.z);u.targetRot=0;padMat.opacity=inZone(hitPt)?.75:.35}}
    return;
  }
  if(e.target!==renderer.domElement||e.pointerType!=='mouse'){return}
  const m=pick(e);hover=m;
  renderer.domElement.style.cursor=m?(mode==='build'?'grab':'pointer'):'';
  const showName=m&&(mode==='explore'||(mode==='build'&&level==='leicht'));
  if(showName){const r=stage.getBoundingClientRect();tooltip.style.display='block';tooltip.textContent=(mode==='explore'?m.userData.ly.n+' – ':'')+m.userData.ly.name;tooltip.style.left=(e.clientX-r.left+14)+'px';tooltip.style.top=(e.clientY-r.top+10)+'px'}
  else tooltip.style.display='none';
});
window.addEventListener('pointerup',e=>{
  if(!drag)return;
  const {m,moved}=drag;drag=null;controls.enabled=true;m.userData.dragging=false;padMat.opacity=.35;
  if(!moved){tryPlace(m.userData.b);return}
  setRay(e);const ok=ray.ray.intersectPlane(dragPlane,hitPt)&&inZone(hitPt);
  if(ok)tryPlace(m.userData.b);else setTargets();
});
let downXY=null;
renderer.domElement.addEventListener('pointerdown',e=>{downXY=[e.clientX,e.clientY]});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downXY||mode!=='explore')return;const d=Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1]);downXY=null;if(d>6)return;
  const m=pick(e);if(m)selectLayer(m.userData.b);
});
renderer.domElement.addEventListener('pointerleave',()=>{hover=null;tooltip.style.display='none'});
controls.addEventListener('start',()=>{camGoal=null});

/* =========================================================
   LABELS & RENDER-SCHLEIFE
   ========================================================= */
const v3=new THREE.Vector3();
function proj(x,y,z){v3.set(x,y,z).project(camera);return v3.z>1?null:[(v3.x*.5+.5)*stage.clientWidth,(-v3.y*.5+.5)*stage.clientHeight]}
function updateLabels(){
  if(mode==='prod'){labelsEl.innerHTML=prodLabels();return}
  if(mode==='tiles'){labelsEl.innerHTML='';const R=ROOMS[T.room];const p=proj(0,.05,R.d/2+.35);const q=proj(0,.05,-R.d/2-.4);
    if(p)labelsEl.innerHTML+=`<div class="lbl zone" style="left:${p[0]}px;top:${p[1]}px">Eingang</div>`;if(q)labelsEl.innerHTML+=`<div class="lbl zone" style="left:${q[0]}px;top:${q[1]}px">Hauptwand</div>`;return}
  let html='';
  if(mode==='build'&&placed===0){const p=proj(0,.01,1.55);if(p)html+=`<div class="lbl zone" style="left:${p[0]}px;top:${p[1]}px">hier aufbauen</div>`}
  meshes.forEach(m=>{
    const u=m.userData,ly=u.ly;let content=null,cls='';
    if(mode==='explore'&&showLabels)content=`<span class="dot">${ly.n}</span>`;
    if(mode==='name'){
      if(nameIdx<meshes.length&&nameQueue[nameIdx]===u.b){content='<span class="dot">?</span>';cls='q'}
      else if(nameSolved.has(u.b))content=`<span class="dot">${ly.n}</span><span class="txt">${ly.name}</span>`;
    }
    if(!content)return;
    const len=ly.separate?LM:L;
    const p=proj(m.position.x+len/2+.15,m.position.y,m.position.z+(ly.separate?WM:W)/2);if(!p)return;
    html+=`<div class="lbl ${cls}" style="left:${p[0]}px;top:${p[1]}px">${content}</div>`;
  });
  labelsEl.innerHTML=html;
}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
window.addEventListener('resize',()=>{resize();aimCamera()});

const clock=new THREE.Clock();let time=0;
function loop(){
  const dt=Math.min(clock.getDelta(),.05);time+=dt;
  const k=1-Math.exp(-dt*7),kd=1-Math.exp(-dt*22);
  meshes.forEach(m=>{
    const u=m.userData;
    u.cur.lerp(u.target,u.dragging?kd:k);u.rot+=(u.targetRot-u.rot)*k;
    let ox=0;if(u.shake>0){u.shake-=dt;ox=Math.sin(time*55)*.09*Math.max(u.shake,0)/.5}
    m.position.set(u.cur.x+ox,u.cur.y,u.cur.z);m.rotation.y=u.rot;
    let r=0,g=0,b=0;
    if(hover===m||(drag&&drag.m===m)){r=g=b=.12}
    if(selected===m&&mode==='explore'){r=.05;g=.15;b=.35}
    if(mode==='name'&&nameIdx<meshes.length&&nameQueue[nameIdx]===u.b){const p=(Math.sin(time*5)+1)/2;r=.45*p;g=.22*p}
    if(u.flash){u.flash.t-=dt;if(u.flash.t<=0)u.flash=null;else{const p=Math.min(1,u.flash.t)*(.6+.4*Math.sin(time*14));r=u.flash.col[0]*p;g=u.flash.col[1]*p;b=u.flash.col[2]*p}}
    m.material.emissive.setRGB(r,g,b);
  });
  if(neighbor){const nd=neighbor.userData;nd.t+=dt;if(nd.t>.6)neighbor.position.z+=(nd.to-neighbor.position.z)*k*.6}
  pad.visible=mode==='build';root.visible=mode!=='prod'&&mode!=='tiles';prodGroup.visible=mode==='prod';tilesGroup.visible=mode==='tiles';
  if(mode==='prod')prodTick(dt,time);
  if(camGoal){camera.position.lerp(camGoal.pos,k*.8);controls.target.lerp(camGoal.tgt,k*.8);if(camera.position.distanceTo(camGoal.pos)<.02)camGoal=null}
  controls.update();
  renderer.render(scene,camera);
  updateLabels();
  requestAnimationFrame(loop);
}

 press:{name:"Pressverfahren",kap:"Heft 1, Kap. 3 – Herstellung von PVC-Belägen",color:0x5f6b78,

const S=3.4, WEBY=1.0;
const prodGroup=new THREE.Group();prodGroup.visible=false;scene.add(prodGroup);
let curProc='lino', stepIdx=0, playing=false, playT=0, prodStations=[], prodAnims=[], orderState=null;

function M(color,o={}){return new THREE.MeshStandardMaterial(Object.assign({color,roughness:.45,metalness:.35},o))}
function box(w,h,d,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.castShadow=true;m.receiveShadow=true;return m}
function cyl(rt,rb,h,mat,seg=28){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);m.castShadow=true;m.receiveShadow=true;return m}
function rollerZ(r,len,mat){const m=cyl(r,r,len,mat);m.rotation.x=Math.PI/2;return m}
function texClone(key,rep=1){const t=getTex(key).clone();t.needsUpdate=true;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,1);return t}
function legs(g,w,h,d,mat){[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>{const l=box(.08,h,.08,mat);l.position.set(a*w/2,h/2,b*d/2);g.add(l)})}

function buildStation(st,proc){
  const g=new THREE.Group(), steel=M(0x9aa1a8), dark=M(0x4b5258), acc=M(proc.color,{metalness:.2,roughness:.5});
  const anim=[];const W2=1.6;
  switch(st.k){
    case 'tank':{const v=cyl(.6,.6,1.5,acc);v.position.y=1.55;g.add(v);const top=cyl(.15,.6,.4,steel);top.position.y=2.5;g.add(top);
      legs(g,.9,.8,.9,dark);const pipe=cyl(.07,.07,.5,steel);pipe.position.set(.55,.75,0);pipe.rotation.z=Math.PI/3;g.add(pipe);
      const bubbles=[];for(let i=0;i<6;i++){const b=new THREE.Mesh(new THREE.SphereGeometry(.05,8,8),M(0xffffff,{transparent:true,opacity:.6}));g.add(b);bubbles.push(b)}
      anim.push((t)=>bubbles.forEach((b,i)=>{const p=(t*.4+i/6)%1;b.position.set(Math.sin(i*2)*.3,2.5+p*.9,Math.cos(i*2)*.3);b.scale.setScalar(1-p*.5)}));break}
    case 'kneader':case 'mixer':{const tr=box(1.3,.8,1.1,acc);tr.position.y=1.4;g.add(tr);legs(g,1.1,1.0,.9,dark);
      const r1=rollerZ(.18,1.0,steel),r2=rollerZ(.18,1.0,steel);r1.position.set(-.3,1.85,0);r2.position.set(.3,1.85,0);g.add(r1,r2);
      [r1,r2].forEach(r=>{for(let i=0;i<4;i++){const b=box(.06,.42,.08,steel);b.position.set(0,0,-.4+i*.27);b.rotation.y=i;r.add(b)}});
      const mass=box(1.1,.1,.9,M(st.out&&st.out.col||0x888888,{metalness:0,roughness:.9}));mass.position.y=1.79;g.add(mass);
      anim.push((t)=>{r1.rotation.y=t*2;r2.rotation.y=-t*2});break}
    case 'crusher':{const h=box(1.1,.6,1,acc);h.position.y=2.0;g.add(h);legs(g,1,1.7,.8,dark);
      const r1=rollerZ(.2,.9,steel),r2=rollerZ(.2,.9,steel);r1.position.set(-.22,1.62,0);r2.position.set(.22,1.62,0);g.add(r1,r2);
      const chips=[];for(let i=0;i<14;i++){const c=box(.07,.07,.07,M([0x7fa257,0xb6cf8d,0x6f9249,0x9aa6b2,0xffffff][i%5],{metalness:0}));g.add(c);chips.push(c)}
      anim.push((t)=>{r1.rotation.y=t*3;r2.rotation.y=-t*3;chips.forEach((c,i)=>{const p=(t*.6+i/14)%1;c.position.set(Math.sin(i*7)*.3,1.45-p*.4,Math.cos(i*5)*.35);c.rotation.set(t+i,t*2,i)})});break}
    case 'calender':{const fr1=box(.12,2.0,.12,dark),fr2=fr1.clone();fr1.position.set(0,1,-.85);fr2.position.set(0,1,.85);g.add(fr1,fr2);
      const rs=[[-.42,WEBY+.72],[0,WEBY+.36],[.42,WEBY+.72]].map(([x,y],i)=>{const r=rollerZ(.34,1.7,steel);r.position.set(x,y-(i===1?0:0),0);g.add(r);return r});
      const low=rollerZ(.34,1.7,steel);low.position.set(0,WEBY-.36,0);g.add(low);
      anim.push((t)=>{rs.forEach((r,i)=>r.rotation.y=(i%2?-1:1)*t*1.5);low.rotation.y=t*1.5});
      if(st.feed){const roll=rollerZ(.4,1.5,new THREE.MeshStandardMaterial({map:texClone(st.feed),roughness:.8}));roll.position.set(-.6,WEBY-1.0+.4,0);g.add(roll);anim.push(t=>roll.rotation.y=t)}
      break}
    case 'unwind':case 'rewind':{legs(g,.2,WEBY+.4,1.7,dark);const tex=st.feed||((st.k==='unwind')?(st.out&&st.out.tex)||'fleece':(st.prevTex||'woodMid'));
      const roll=rollerZ(st.k==='rewind'?.55:.5,1.5,new THREE.MeshStandardMaterial({map:texClone(tex==='clear'?'clearGrain':tex),roughness:.8,transparent:tex==='clear',opacity:tex==='clear'?.7:1}));
      roll.position.set(0,WEBY+.5,0);g.add(roll);const ax=rollerZ(.06,1.9,steel);ax.position.copy(roll.position);g.add(ax);
      anim.push((t)=>{roll.rotation.y=(st.k==='rewind'?1:-1)*t*.8});break}
    case 'coater':{const tr=box(.7,.4,1.7,acc);tr.position.y=WEBY+.55;g.add(tr);const blade=box(.05,.3,1.7,steel);blade.position.set(.38,WEBY+.2,0);g.add(blade);
      legs(g,.8,WEBY+.75,1.7,dark);const drip=cyl(.04,.04,.3,M(0xf0f0f0,{transparent:true,opacity:.7}));drip.position.set(0,WEBY+.2,0);g.add(drip);
      anim.push((t)=>{drip.scale.y=.7+.3*Math.sin(t*6)});break}
    case 'bark':{const trunk=cyl(.45,.55,3.2,M(0x6b4a2e,{metalness:0,roughness:1}));trunk.position.set(-.2,1.6,-.3);g.add(trunk);
      const crown=new THREE.Mesh(new THREE.SphereGeometry(1.1,16,12),M(0x4f7a3a,{metalness:0,roughness:1}));crown.position.set(-.2,3.6,-.3);crown.scale.y=.6;g.add(crown);
      const peeled=cyl(.47,.47,1.1,M(0xb5532d,{metalness:0,roughness:.9}));peeled.position.set(-.2,.75,-.3);g.add(peeled);
      const pieces=[];for(let i=0;i<5;i++){const pc=box(.5,.06,.3,M(0x8b5a2b,{metalness:0,roughness:1}));g.add(pc);pieces.push(pc)}
      anim.push((t)=>pieces.forEach((pc,i)=>{const q=(t*.25+i/5)%1;pc.position.set(.3+q*.9,1.1-q*1.0+.1,-.1+i*.08);pc.rotation.z=q*1.2}));break}
    case 'stack':{for(let i=0;i<6;i++){const pl=box(1.2,.12,1.2,new THREE.MeshStandardMaterial({map:texClone(st.plates?'cork':'cork'),color:st.plates?0xffffff:0x9b6a3a,roughness:.9}));pl.position.set((i%2)*.05,.06+i*.13,0);pl.rotation.y=i*.08;g.add(pl)}
      const lbl=box(.6,.3,.04,M(0xffffff,{metalness:0}));lbl.position.set(0,.6,.62);g.add(lbl);break}
    case 'bath':{const L2=2.0;const tr=box(L2,.6,1.9,acc);tr.position.y=WEBY-.25;g.add(tr);legs(g,L2,WEBY-.5,1.8,dark);
      const wat=new THREE.Mesh(new THREE.PlaneGeometry(L2-.1,1.8),new THREE.MeshStandardMaterial({color:0x5aa0d8,transparent:true,opacity:.55,roughness:.1}));wat.rotation.x=-Math.PI/2;wat.position.y=WEBY+.08;g.add(wat);
      const ir=box(L2,.12,1.9,M(0x444444));ir.position.y=WEBY+.9;g.add(ir);const glow=new THREE.Mesh(new THREE.PlaneGeometry(L2,1.7),new THREE.MeshBasicMaterial({color:0xff4422,transparent:true,opacity:.4,side:THREE.DoubleSide}));glow.rotation.x=Math.PI/2;glow.position.y=WEBY+.83;g.add(glow);
      anim.push((t)=>{wat.position.y=WEBY+.08+Math.sin(t*2)*.01;glow.material.opacity=.3+.15*Math.sin(t*3)});break}
    case 'oven':{const L2=2.4;const top=box(L2,.12,1.9,acc);top.position.y=WEBY+.75;g.add(top);
      const s1=box(L2,.9,.1,acc),s2=s1.clone();s1.position.set(0,WEBY+.3,-.95);s2.position.set(0,WEBY+.3,.95);g.add(s1,s2);
      const glow=new THREE.Mesh(new THREE.PlaneGeometry(L2,1.7),new THREE.MeshBasicMaterial({color:0xff7a2a,transparent:true,opacity:.55,side:THREE.DoubleSide}));
      glow.rotation.x=Math.PI/2;glow.position.y=WEBY+.68;g.add(glow);legs(g,L2,WEBY-.05,1.8,dark);
      anim.push((t)=>{glow.material.opacity=.4+.2*Math.sin(t*3)});break}
    case 'printer':{const pc=rollerZ(.45,1.7,new THREE.MeshStandardMaterial({map:texClone(st.out&&st.out.tex||'woodMid'),roughness:.5}));pc.position.set(0,WEBY+.47,0);g.add(pc);
      const cr=rollerZ(.25,1.7,steel);cr.position.set(0,WEBY-.27,0);g.add(cr);const fr1=box(.12,1.8,.12,dark),fr2=fr1.clone();fr1.position.set(0,.9,-.9);fr2.position.set(0,.9,.9);g.add(fr1,fr2);
      const ink=box(.5,.3,1.5,acc);ink.position.set(-.5,WEBY+1.05,0);g.add(ink);
      if(st.feed){const roll=rollerZ(.35,1.5,new THREE.MeshStandardMaterial({map:texClone(st.feed),roughness:.8}));roll.position.set(.9,WEBY+1.3,0);g.add(roll);anim.push(t=>roll.rotation.y=-t)}
      anim.push((t)=>{pc.rotation.y=-t*1.2;cr.rotation.y=t*2});break}

function buildSegment(x0,x1,out,i){
  const g=new THREE.Group(), len=x1-x0, cx=(x0+x1)/2;
  if(!out)return g;
  if(out.kind==='web'){
    const tex=texClone(out.tex,len/3);
    const m=new THREE.Mesh(new THREE.BoxGeometry(len,.035,1.4),new THREE.MeshStandardMaterial({map:tex,roughness:.7}));
    m.position.set(cx,WEBY,0);m.receiveShadow=true;m.castShadow=true;g.add(m);
    g.userData.tick=(dt)=>{tex.offset.x-=dt*.12*(3/len)*(len/3)};
  }else{
    const belt=box(len,.06,1.2,M(0x2f3337,{metalness:.1,roughness:.9}));belt.position.set(cx,WEBY-.06,0);g.add(belt);
    for(let s=0;s<2;s++){const r=rollerZ(.06,1.25,M(0x9aa1a8));r.position.set(s?x1:x0,WEBY-.06,0);g.add(r)}
    const items=[];const n=out.kind==='bulk'?10:3;
    for(let k=0;k<n;k++){let it;
      if(out.kind==='bulk'){const col=out.cork?[0xc48d58,0x8b5a2b,0xe0b27c,0xa06a38][k%4]:out.multi?[0x7fa257,0xb6cf8d,0x6f9249,0xc9dca4,0x9aa6b2][k%5]:out.col;it=box(.18,.12,.18,M(col,{metalness:0,roughness:.9}))}
      else{it=box(.7,.06,.7,new THREE.MeshStandardMaterial({map:texClone(out.tex),roughness:.7}))}
      g.add(it);items.push(it)}
    let ph=0;g.userData.tick=(dt)=>{ph=(ph+dt*.15)%1;items.forEach((it,k)=>{const p=(ph+k/items.length)%1;it.position.set(x0+p*len,WEBY+.02,out.kind==='bulk'?Math.sin(k*2.7)*.35:0)})};
  }
  return g;
}

/* =========================================================
   FLIESEN AUFTEILEN (Heft 2, Kap. „Elastische Fliesen und Planken verlegen“)
   Einheit: 1 Welteinheit = 1 m
   ========================================================= */
const ROOMS=[{n:"Klassenzimmer",w:4.37,d:3.62},{n:"Büro",w:3.85,d:3.10},{n:"Flur",w:5.12,d:2.24},{n:"Arztpraxis",w:4.66,d:4.18}];
const tilesGroup=new THREE.Group();tilesGroup.visible=false;scene.add(tilesGroup);
let T={room:0,a:.5,diag:false,xo:null,zo:null,alt:true,checked:null};
const clipPlanes=[new THREE.Plane(new THREE.Vector3(1,0,0),0),new THREE.Plane(new THREE.Vector3(-1,0,0),0),new THREE.Plane(new THREE.Vector3(0,0,1),0),new THREE.Plane(new THREE.Vector3(0,0,-1),0)];
renderer.localClippingEnabled=true;
const mod=(v,m)=>((v%m)+m)%m;
function tileStep(){return T.diag?T.a*Math.SQRT2:T.a}
function tileEdges(){
  const R=ROOMS[T.room],s=tileStep();
  let l=mod(T.xo,s),r=mod(R.w-T.xo,s),b=mod(T.zo,s),f=mod(R.d-T.zo,s);
  const fix=v=>(Math.abs(v-s)<.004||v<.004?0:v);
  return {l:fix(l),r:fix(r),b:fix(b),f:fix(f),s};
}
function cm(v){return Math.round(v*100)}
function buildTiles(){
  tilesGroup.children.slice().forEach(c=>{tilesGroup.remove(c);c.traverse(o=>{if(o.isMesh||o.isLine){o.geometry.dispose();if(o.material.map)o.material.map.dispose();o.material.dispose()}})});
  const R=ROOMS[T.room],W=R.w,D=R.d,ox=-W/2,oz=-D/2;
  clipPlanes[0].constant=-ox;clipPlanes[1].constant=ox+W;clipPlanes[2].constant=-oz;clipPlanes[3].constant=oz+D;
  // Estrich / Untergrund und Wände
  const fl=new THREE.Mesh(new THREE.BoxGeometry(W+.3,.06,D+.3),new THREE.MeshStandardMaterial({map:texClone('screed',2),roughness:.95}));fl.position.y=-.03;fl.receiveShadow=true;tilesGroup.add(fl);
  const wm=new THREE.MeshStandardMaterial({color:0xece6dc,roughness:.9});
  [[0,-D/2-.075,W+.3,.15],[-W/2-.075,0,.15,D],[W/2+.075,0,.15,D]].forEach(([x,z,w,d])=>{const wl=box(w,.5,d,wm);wl.position.set(x,.25,z);tilesGroup.add(wl)});
  // Eingang (Tür) an der Vorderwand
  const fw1=box(W/2-.45,.5,.15,wm),fw2=fw1.clone();fw1.position.set(-W/4-.225,.25,D/2+.075);fw2.position.set(W/4+.225,.25,D/2+.075);tilesGroup.add(fw1,fw2);
  const door=box(.9,.02,.15,new THREE.MeshStandardMaterial({color:0xb5652b}));door.position.set(0,.01,D/2+.075);tilesGroup.add(door);
  // Fliesen
  const a=T.a,s=tileStep(),gap=.004;
  const tA=texClone('stoneDecor'),tB=texClone('stoneDecor');tB.rotation=Math.PI/2;tB.center.set(.5,.5);
  const mWhole=[tA,tB].map(t=>new THREE.MeshStandardMaterial({map:t,roughness:.6,clippingPlanes:clipPlanes}));
  const mCut=[tA,tB].map(t=>new THREE.MeshStandardMaterial({map:t,color:0xffc89a,roughness:.6,clippingPlanes:clipPlanes}));
  const geo=new THREE.BoxGeometry(a-gap,.02,a-gap);
  const xs=ox+T.xo,zs=oz+T.zo,inside=(x,z)=>x>=ox-1e-4&&x<=ox+W+1e-4&&z>=oz-1e-4&&z<=oz+D+1e-4;
  const nI=Math.ceil(W/s)+3,nJ=Math.ceil(D/s)+3;
  const place=(cx,cz,k)=>{const h=T.diag?a*Math.SQRT2/2:a/2;
    if(cx+h<ox||cx-h>ox+W||cz+h<oz||cz-h>oz+D)return;
    const corners=T.diag?[[cx-h,cz],[cx+h,cz],[cx,cz-h],[cx,cz+h]]:[[cx-h,cz-h],[cx+h,cz-h],[cx-h,cz+h],[cx+h,cz+h]];
    const whole=corners.every(([x,z])=>inside(x,z));
    const alt=T.alt?(k%2):0;
    const t=new THREE.Mesh(geo,(whole?mWhole:mCut)[alt]);t.position.set(cx,.012,cz);if(T.diag)t.rotation.y=Math.PI/4;t.receiveShadow=true;tilesGroup.add(t)};
  for(let i=-nI;i<=nI;i++)for(let j=-nJ;j<=nJ;j++){
    place(xs+(i+.5)*s,zs+(j+.5)*s,i+j);
    if(T.diag)place(xs+i*s,zs+j*s,i+j+1);
  }
  // Schnurschläge und Anfangspunkt
  const lm1=new THREE.LineBasicMaterial({color:0xd62828}),lm2=new THREE.LineBasicMaterial({color:0x2d5d8f});
  const ln=(p1,p2,m)=>{const g=new THREE.BufferGeometry().setFromPoints([p1,p2]);const l=new THREE.Line(g,m);tilesGroup.add(l)};
  ln(new THREE.Vector3(ox,.03,zs),new THREE.Vector3(ox+W,.03,zs),lm1);
  ln(new THREE.Vector3(xs,.03,oz),new THREE.Vector3(xs,.03,oz+D),lm2);
  const mk=cyl(.05,.05,.04,new THREE.MeshStandardMaterial({color:0xd62828}));mk.position.set(xs,.04,zs);tilesGroup.add(mk);
}
function tilesOptimal(){
  const R=ROOMS[T.room],s=tileStep();
  let r=mod(R.w,s)/2;if(r<.1)r+=s/2;          // Randfliesen links/rechts gleich groß, mind. 10 cm
  const xo=r+Math.floor((R.w/2-r)/s)*s;      // Linie möglichst in Raummitte
  let zo=mod(R.d,s);                          // vorne (Eingang) ganze Fliesen, hinten der Rest …
  if(zo<.1)zo=(zo+s)/2;                       // … außer der Rest wäre < 10 cm: dann vorne und hinten gleich große Randfliesen
  zo=zo+Math.floor((R.d/2-zo)/s)*s;
  return {xo,zo};
}
function renderTiles(){
  const R=ROOMS[T.room],e=tileEdges(),s=e.s;
  const restD=mod(R.d,s),okLR=Math.abs(e.l-e.r)<.011, okMin=[e.l,e.r,e.b,e.f].every(v=>v===0||v>=.099), okF=e.f===0||(restD<.1&&Math.abs(e.f-e.b)<.011);
  pane.innerHTML=`<h2>Fliesen aufteilen</h2><div class="muted" style="font-size:.8rem">📖 Heft 2 – Elastische Fliesen und Planken verlegen</div>
    <div class="task">Verschiebe die Schnurschläge so, dass <b>links und rechts gleich große Randfliesen</b> (mind. 10 cm) entstehen und am <b>Eingang ganze Fliesen</b> liegen.</div>
    <div class="levels">Verlegeart: <span class="seg"><button data-d="0" class="${!T.diag?'on':''}">Parallel</button><button data-d="1" class="${T.diag?'on':''}">Diagonal</button></span></div>
    <label class="ctl">Raum <select id="tRoom">${ROOMS.map((r,i)=>`<option value="${i}" ${i===T.room?'selected':''}>${r.n} – ${String(r.w).replace('.',',')} × ${String(r.d).replace('.',',')} m</option>`).join('')}</select></label>
    <label class="ctl">Fliese <select id="tSize">${[.3,.5,.6].map(v=>`<option value="${v}" ${v===T.a?'selected':''}>${cm(v)} × ${cm(v)} cm</option>`).join('')}</select></label>
    ${T.diag?`<p class="muted" style="margin:4px 0">Bei der Diagonalverlegung rechnest du mit der Fliesendiagonale: ${cm(T.a)} cm × 1,414 = <b>${(T.a*141.4).toFixed(1).replace('.',',')} cm</b>.</p>`:''}
    <label class="ctl">Schnurschlag ↔ (blau): <input type="range" id="tX" min="0" max="${Math.round(R.w*100)}" step="1" value="${cm(T.xo)}"><b style="min-width:58px">${cm(T.xo)} cm</b></label>
    <label class="ctl">Schnurschlag ↕ (rot): <input type="range" id="tZ" min="0" max="${Math.round(R.d*100)}" step="1" value="${cm(T.zo)}"><b style="min-width:58px">${cm(T.zo)} cm</b></label>
    <table style="width:100%;font-size:.92rem;border-collapse:collapse;margin-top:6px">
      <tr><td>Randfliese links</td><td><b>${cm(e.l)} cm</b></td><td>rechts</td><td><b>${cm(e.r)} cm</b></td></tr>
      <tr><td>hinten (Hauptwand)</td><td><b>${cm(e.b)} cm</b></td><td>vorne (Eingang)</td><td><b>${e.f===0?'ganze Fliese':cm(e.f)+' cm'}</b></td></tr></table>
    <label class="ctl"><input type="checkbox" id="tAlt" ${T.alt?'checked':''}> wechselnde Laufrichtung (Kreuzfuge)</label>
    <div class="row"><button class="btn primary" id="tChk">Prüfen</button><button class="btn" id="tHelp">💡 Lösungsweg</button><button class="btn" id="tNew">Neue Aufgabe</button></div>
    ${T.checked?`<div class="${okLR&&okMin&&okF?'done-box':'info'}" style="margin-top:10px">
      ${okLR?'✅':'❌'} Randfliesen links und rechts gleich groß<br>
      ${okMin?'✅':'❌'} alle Randfliesen mindestens 10 cm (FCIÖ-Merkblatt 21)<br>
      ${okF?'✅':'❌'} am Eingang ganze Fliesen${restD<.1?' (hier nicht möglich, weil hinten sonst ein Streifen unter 10 cm bliebe – dann vorne und hinten gleich groß)':''}
      ${okLR&&okMin&&okF?'<br><b>Sehr gut aufgeteilt!</b>':''}</div>`:''}
    <div id="tHelpBox"></div>
    <div class="merke">${T.diag?'Diagonalverlegung: Anfangspunkt wie bei der Parallelverlegung, aber mit der Fliesendiagonale (Breite × 1,414). Die erste Fliese wird mit gegenüberliegenden Ecken auf dem Schnurschlag fixiert. Randfliesen schneidest du mit einer quadratischen Schablone (Kantenlänge = Fliesendiagonale).':'Parallelverlegung: Vom Eingang aus parallel zur Hauptwand eine Linie schnuren, sodass an beiden gegenüberliegenden Wänden gleich große Randfliesen entstehen. Im rechten Winkel dazu eine Hilfslinie – dort wird die erste Fliese fixiert. Statt schmaler Randstücke kann ein Fries verlegt werden.'}</div>`;
  pane.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{T.diag=b.dataset.d==='1';T.checked=null;resetTiles(true)});
  $('#tRoom').onchange=e=>{T.room=+e.target.value;T.checked=null;resetTiles(true)};
  $('#tSize').onchange=e=>{T.a=+e.target.value;T.checked=null;resetTiles(true)};
  $('#tX').oninput=e=>{T.xo=+e.target.value/100;T.checked=null;buildTiles();renderTilesLive()};
  $('#tZ').oninput=e=>{T.zo=+e.target.value/100;T.checked=null;buildTiles();renderTilesLive()};
  $('#tX').onchange=$('#tZ').onchange=()=>renderTiles();
  $('#tAlt').onchange=e=>{T.alt=e.target.checked;buildTiles()};
  $('#tChk').onclick=()=>{T.checked=true;renderTiles()};
  $('#tNew').onclick=()=>{T.room=(T.room+1)%ROOMS.length;T.checked=null;resetTiles(true)};
  $('#tHelp').onclick=()=>{const R=ROOMS[T.room],o=tilesOptimal(),s=tileStep(),r=mod(R.w,s);
    $('#tHelpBox').innerHTML=`<div class="info"><b>Lösungsweg</b><p>Raumbreite ${cm(R.w)} cm : ${T.diag?'Diagonale ':'Fliese '}${(s*100).toFixed(1).replace('.',',')} cm → Rest <b>${(r*100).toFixed(1).replace('.',',')} cm</b>.</p>
    <p>Rest halbieren → je Seite ${(r*50).toFixed(1).replace('.',',')} cm.${r/2<.1?` Das ist kleiner als 10 cm – deshalb eine halbe ${T.diag?'Diagonale':'Fliese'} dazunehmen: je Seite ${((r+s)/2*100).toFixed(1).replace('.',',')} cm.`:''}</p>
    <p>Blauen Schnurschlag z. B. auf <b>${cm(o.xo)} cm</b> setzen, roten auf <b>${cm(o.zo)} cm</b> (dann liegen vorne ganze Fliesen).</p>
    <button class="btn" id="tApply">Lösung übernehmen</button></div>`;
    $('#tApply').onclick=()=>{T.xo=o.xo;T.zo=o.zo;T.checked=true;buildTiles();renderTiles()}};
}
function renderTilesLive(){const e=tileEdges();const bs=pane.querySelectorAll('label.ctl b');if(bs[0])bs[0].textContent=cm(T.xo)+' cm';if(bs[1])bs[1].textContent=cm(T.zo)+' cm';
  const tds=pane.querySelectorAll('table td b');if(tds.length===4){tds[0].textContent=cm(e.l)+' cm';tds[1].textContent=cm(e.r)+' cm';tds[2].textContent=cm(e.b)+' cm';tds[3].textContent=e.f===0?'ganze Fliese':cm(e.f)+' cm'}}
function resetTiles(keepView){const R=ROOMS[T.room];T.xo=Math.round(R.w*30)/100;T.zo=Math.round(R.d*40)/100;buildTiles();renderTiles();if(!keepView||true)tilesCam()}
function tilesCam(){const R=ROOMS[T.room],aspect=stage.clientWidth/Math.max(stage.clientHeight,1);const d=Math.max(5,(Math.max(R.w,R.d)/2+.8)/(Math.tan(19*Math.PI/180)*Math.min(aspect,1.3)));
  camGoal={pos:new THREE.Vector3(0,d*.9,d*.45),tgt:new THREE.Vector3(0,0,0)}}

/* =========================================================
   ANLEITUNG & AUFTRÄGE (passend zum Skriptum) + Direktlinks
   Direktlinks: #anleitung · #bau-<id> · #erkunden-<id> · #benennen-<id> · #herstellung-<verfahren>
   ========================================================= */
const AUFTRAEGE=[
 {kap:"Heft 1 · Kap. 1",t:"Aufbau und Schichten",a:"Baue den Belag „Schichten allgemein“ auf (Stufe Mittel). Wechsle zu „Benennen“ und benenne alle fünf Schichten (Stufe Schwer).",go:[["bau-schichten","Bauen"],["benennen-schichten","Benennen"]]},
 {kap:"Heft 1 · Kap. 3",t:"Herstellung von PVC-Belägen",a:"Gehe das Kalander-, Press- und Streichverfahren Station für Station durch. Löse bei jedem Verfahren die Reihenfolge-Übung.",go:[["herstellung-kalander","Kalander"],["herstellung-press","Pressen"],["herstellung-streich","Streichen"]]},
 {kap:"Heft 1 · Kap. 3",t:"CV-Belag",a:"Baue den geschäumten PVC-Belag (CV) auf. Erkläre im Erkunden-Modus, welche Schicht das Relief bildet.",go:[["bau-cv","Bauen"],["erkunden-cv","Erkunden"]]},
 {kap:"Heft 1 · Kap. 4",t:"Linoleum",a:"Ordne die Herstellungsschritte von Linoleum. Erkunde danach Marmoleum und vergleiche es mit Jokaleum.",go:[["herstellung-lino","Herstellung"],["erkunden-marmoleum","Marmoleum"],["erkunden-jokaleum","Jokaleum"]]},
 {kap:"Heft 1 · Kap. 5",t:"Elastomer- und Gummibeläge",a:"Baue den profilierten und den heterogenen Elastomerbelag. Löse die Reihenfolge-Übung zur Herstellung.",go:[["bau-elastomer-noppen","Profiliert"],["bau-elastomer-hetero","Heterogen"],["herstellung-kautschuk","Herstellung"]]},
 {kap:"Heft 1 · Kap. 6",t:"Korkböden",a:"Ordne die Herstellung von Korkbelägen. Baue danach den Kork-Fertigfußboden und vergleiche ihn mit der Korkfliese mit PVC-Nutzschicht.",go:[["herstellung-kork","Herstellung"],["bau-kork-fertig","Fertigfußboden"],["bau-kork-pvc","Korkfliese"]]},
 {kap:"Heft 1 · Kap. 7",t:"Designbeläge und MMF",a:"Baue PVC-Designbelag, Rigid-Designbelag, PUR-Designbelag, Multilayer und Linoleum-Paneel. Vergleiche: Woraus besteht jeweils der Träger?",go:[["bau-design","PVC-Design"],["bau-rigid","Rigid"],["bau-pur-design","PUR"],["bau-multilayer","MMF"],["bau-lino-paneel","Lino-Paneel"]]},
 {kap:"Heft 2 · Kap. 1–2",t:"Untergrund und Kleben",a:"Baue den verklebten Systemaufbau von unten nach oben. Begründe, warum vor dem Nassbett gespachtelt wird.",go:[["bau-verklebt","Bauen"]]},
 {kap:"Heft 2 · Bes. Verlegetechniken",t:"Ableitfähige Verklebung",a:"Baue die ableitfähige Verklebung. Notiere Abstand der Kupferbänder und Fläche je Erdungsstelle.",go:[["bau-ableitfaehig","Bauen"],["herstellung-press","Herstellung Belag"]]},
 {kap:"Heft 2 · Fliesen verlegen",t:"Fliesen aufteilen",a:"Teile den Raum für eine Parallel- und eine Diagonalverlegung auf: gleich große Randfliesen (mind. 10 cm), am Eingang ganze Fliesen. Prüfe mit „Prüfen“.",go:[["fliesen-parallel","Parallel"],["fliesen-diagonal","Diagonal"]]},
 {kap:"Heft 2 · Designbeläge",t:"Klick schwimmend verlegen",a:"Baue den schwimmenden Aufbau. Zeige mit „Zwei Dielen verbinden“, wie die Klickverbindung einrastet.",go:[["bau-klick","Bauen"],["erkunden-klick","Verbindung"]]}
];
function guideDone(){try{return JSON.parse(localStorage.getItem('bb3d_guide')||'[]')}catch(e){return[]}}
function renderGuide(){
  const done=guideDone();
  $('#guideBody').innerHTML=`<h2>Anleitung – 3D-Baukasten Elastische Beläge</h2>
  <p class="muted">Begleitet das Skriptum „Elastische Beläge“ Heft 1 (Material) und Heft 2 (Verlegung).</p>
  <h3>So bedienst du den Baukasten</h3>
  <ol>
   <li><b>Belag wählen:</b> oben in der Leiste – Lehrbuch-Aufbauten, Skriptum Heft 1, Heft 2 (Verlegung) und Beispiele von Forbo und INKU.</li>
   <li><b>Bauen:</b> Ziehe die Schichten von <b>unten nach oben</b> auf die helle Fläche (oder antippen). Stufe Leicht / Mittel / Schwer wählen.</li>
   <li><b>Erkunden:</b> Schicht anklicken → Erklärung. Regler „Explosionsansicht“ zieht den Aufbau auseinander. „Stirnseite“ zeigt den Querschnitt.</li>
   <li><b>Benennen:</b> Die markierte Schicht (orange „?“) richtig benennen.</li>
   <li><b>Herstellung:</b> Verfahren wählen, mit ◀ ▶ von Station zu Station. Danach die Reihenfolge-Übung lösen.</li>
   <li><b>Fliesen:</b> Raum und Fliese wählen, die Schnurschläge verschieben, bis die Aufteilung stimmt – dann „Prüfen“.</li>
   <li><b>3D-Ansicht:</b> ziehen = drehen, Mausrad oder zwei Finger = zoomen, Rechtsklick = verschieben.</li>
  </ol>
  <h3>Aufträge zum Skriptum</h3>
  <table><tr><th>✓</th><th>Kapitel</th><th>Auftrag</th><th>Öffnen</th></tr>
  ${AUFTRAEGE.map((x,i)=>`<tr class="${done.includes(i)?'done':''}"><td><input type="checkbox" data-gi="${i}" ${done.includes(i)?'checked':''} aria-label="erledigt"></td><td class="kap">${x.kap}</td><td><b>${x.t}</b><br>${x.a}</td><td>${x.go.map(g=>`<button class="go" data-h="${g[0]}">${g[1]}</button>`).join('')}</td></tr>`).join('')}
  </table>
  <p class="muted" style="font-size:.85rem;margin-top:12px">Häkchen werden nur in diesem Browser gespeichert. Ergebnisse (Sterne, Zeit, Fehler) überträgst du in dein Skriptum bzw. deinen Lernpass.</p>`;
  $('#guideBody').querySelectorAll('[data-gi]').forEach(c=>c.onchange=()=>{let d=guideDone();const i=+c.dataset.gi;d=c.checked?[...new Set([...d,i])]:d.filter(v=>v!==i);try{localStorage.setItem('bb3d_guide',JSON.stringify(d))}catch(e){}renderGuide()});
  $('#guideBody').querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{closeGuide();location.hash=b.dataset.h});
}
function openGuide(){renderGuide();$('#guide').hidden=false}
function closeGuide(){$('#guide').hidden=true;if(location.hash==='#anleitung')location.hash=''}
$('#guideBtn').onclick=()=>{location.hash='anleitung'};
$('#guideClose').onclick=closeGuide;
$('#guide').onclick=e=>{if(e.target.id==='guide')closeGuide()};
function applyHash(){
  const h=decodeURIComponent(location.hash.replace('#',''));if(!h)return;
  if(h==='anleitung'){openGuide();return}
  if(h==='fliesen-parallel'||h==='fliesen-diagonal'){T.diag=h.endsWith('diagonal');setMode('tiles');return}
  const m=h.match(/^(bau|erkunden|benennen|herstellung)-(.+)$/);if(!m)return;
  const modeMap={bau:'build',erkunden:'explore',benennen:'name',herstellung:'prod'};
  if(m[1]==='herstellung'){if(!PROCS[m[2]])return;if(mode!=='prod')setMode('prod');setProc(m[2]);return}
  const i=PRODUCTS.findIndex(p=>p.id===m[2]);if(i<0)return;
  mode=modeMap[m[1]];selectProduct(i);
  if(m[1]==='erkunden'&&m[2]==='klick'){setTimeout(()=>{const nb=$('#nb');if(nb)nb.click()},400)}
}
window.addEventListener('hashchange',applyHash);

/* Start */
resize();
Object.keys(TEX).forEach(getTex);
renderNav();
selectProduct(0);
camera.position.copy(camGoal.pos);controls.target.copy(camGoal.tgt);
applyHash();
loop();
</script>
